name: CI

on:
  push:
    branches: [main, develop, "feat/**", "fix/**"]
  pull_request:

jobs:
  verify:
    name: Lint + Typecheck + Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check (strict)
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Bundle size budgets
        run: npm run size

      - name: Production audit (advisory)
        run: npm audit --omit=dev || echo "::warning::npm audit reported advisories (advisory only)"
        continue-on-error: true

      - name: Dead-export report (advisory)
        run: npx ts-prune --error || echo "::warning::ts-prune flagged unused exports (advisory only)"
        continue-on-error: true
